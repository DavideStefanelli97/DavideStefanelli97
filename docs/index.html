<div id="ascii-profile-complete" aria-label="Animated ASCII profile with links and rotating brain">
<div id="ascii-terminal-live" aria-label="Animated ASCII terminal profile preview">
  <style>
    #ascii-terminal-live {
      --ascii-bg: #000000;
      --ascii-chrome: #aaaaaa;
      --ascii-edge: #656565;
      --ascii-text: #a9b1d6;
      --ascii-keyword: #bb9af7;
      --ascii-name: #7dcfff;
      --ascii-class: #c0caf5;
      --ascii-string: #9ece6a;
      --ascii-comment: #7982a9;
      --ascii-action: #7aa2f7;
      background: transparent;
      width: 100%;
      display: grid;
      gap: 12px;
      justify-items: start;
    }
    #ascii-terminal-live pre {
      background: var(--ascii-bg);
      color: var(--ascii-text);
      margin: 0;
      padding: 12px 10px;
      font-family: Consolas, "Lucida Console", "Courier New", monospace;
      font-size: 11px;
      font-weight: 400;
      line-height: 1.36;
      white-space: pre;
      overflow: hidden;
      max-width: 100%;
    }
    #ascii-terminal-live .edge { color: var(--ascii-edge); }
    #ascii-terminal-live .chrome { color: var(--ascii-chrome); }
    #ascii-terminal-live .prompt { color: var(--ascii-chrome); }
    #ascii-terminal-live .kw { color: var(--ascii-keyword); }
    #ascii-terminal-live .name { color: var(--ascii-name); }
    #ascii-terminal-live .class-name { color: var(--ascii-class); }
    #ascii-terminal-live .string { color: var(--ascii-string); }
    #ascii-terminal-live .comment { color: var(--ascii-comment); }
    #ascii-terminal-live .action { color: var(--ascii-action); }
    #ascii-terminal-live .ascii-link { color: inherit; text-decoration: none; }
    #ascii-terminal-live .ascii-link:hover,
    #ascii-terminal-live .ascii-link:focus-visible { text-decoration: underline; }
    #ascii-terminal-live .cursor { color: #d7d7d7; }
    #ascii-terminal-live .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 610px) {
      #ascii-terminal-live pre { font-size: 9px; padding: 8px 3px; }
    }
  </style>
  <span class="sr-only">ASCII profile and contact windows typing in sequence. Every visible line and window control is made of text characters.</span>
  <pre id="ascii-terminal-intro" aria-hidden="true"></pre>
  <pre id="ascii-terminal-links" aria-hidden="true"></pre>
  <script>
    (function () {
      var root = document.getElementById("ascii-terminal-live");
      var introNode = root.querySelector("#ascii-terminal-intro");
      var linksNode = root.querySelector("#ascii-terminal-links");
      var profile = [
        { prompt: ">>> ", tokens: [["from ", "kw"], ["portfolio", "name"], [" import ", "kw"], ["Profile", "class-name"]] },
        { prompt: ">>> ", tokens: [["profile", "name"], [" = ", ""], ["Profile", "class-name"], ["(", ""]] },
        { prompt: "... ", tokens: [["    role=", "name"], ["\"Computer Vision / AI Research Engineer\"", "string"], [",", ""]] },
        { prompt: "... ", tokens: [["    field=", "name"], ["\"Neuro-engineer\"", "string"], [",", ""]] },
        { prompt: "... ", tokens: [["    focus=", "name"], ["\"Deep Learning Applied to Neuroscience\"", "string"], [",", ""]] },
        { prompt: "... ", tokens: [["    location=", "name"], ["\"Cesena, Italy\"", "string"], [",", ""]] },
        { prompt: "... ", tokens: [["    education=", "name"], ["\"M.Sc. candidate, University of Bologna\"", "string"], [",", ""]] },
        { prompt: "... ", tokens: [[")", ""]] }
      ];
      var cards = [
        { title: "linkedin.py", rows: [
          { prompt: ">>> ", tokens: [["profile", "name"], [".", ""], ["linkedin", "class-name"], [".", ""], ["open", "action"], ["()", ""]] },
          { prompt: "    ", tokens: [["# Professional profile", "comment"]] },
          { prompt: "    ", href: "https://www.linkedin.com/in/davide-stefanelli-engineer/", tokens: [["[ OPEN PROFILE ]", "action"]] }
        ] },
        { title: "email.py", rows: [
          { prompt: ">>> ", tokens: [["profile", "name"], [".", ""], ["email", "class-name"], [".", ""], ["compose", "action"], ["()", ""]] },
          { prompt: "    ", tokens: [["# Start a new message", "comment"]] },
          { prompt: "    ", href: "mailto:davide.stefanelli.ing@gmail.com", tokens: [["[ WRITE EMAIL ]", "action"]] }
        ] },
        { title: "projects.py", rows: [
          { prompt: ">>> ", tokens: [["profile", "name"], [".", ""], ["projects", "class-name"], [".", ""], ["explore", "action"], ["()", ""]] },
          { prompt: "    ", tokens: [["# Vision | EEG | Imaging", "comment"]] },
          { prompt: "    ", href: "https://github.com/DavideStefanelli97#selected-projects", tokens: [["[ EXPLORE WORK ]", "action"]] }
        ] }
      ];
      var cardRows = cards.flatMap(function (card) { return card.rows; });
      var introSchedule = makeSchedule(profile, 17);
      var linksSchedule = makeSchedule(cardRows, 29);
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      var started = performance.now() - 900;
      var previousIntro = "";
      var previousLinks = "";

      function escapeHtml(value) {
        return value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function span(className, value) {
        return '<span class="' + className + '">' + escapeHtml(value) + "</span>";
      }
      function textOf(row) {
        return row.tokens.map(function (token) { return token[0]; }).join("");
      }
      function makeSchedule(rows, seed) {
        var value = seed;
        function random() {
          value = (value * 1664525 + 1013904223) >>> 0;
          return value / 4294967296;
        }
        var now = 350;
        var times = rows.map(function (row) {
          var keys = [];
          for (var char of textOf(row)) {
            now += 17 + random() * 19;
            if (",=()".indexOf(char) >= 0) now += 8 + random() * 20;
            if (char === '"') now += 12 + random() * 25;
            keys.push(now);
          }
          now += 130 + random() * 100;
          return keys;
        });
        return { times: times, duration: now + 1600 };
      }
      function countBy(time, keys) {
        var lo = 0, hi = keys.length;
        while (lo < hi) {
          var mid = (lo + hi) >> 1;
          if (keys[mid] <= time) lo = mid + 1; else hi = mid;
        }
        return lo;
      }
      function state(schedule, elapsed) {
        var time = reduceMotion.matches ? schedule.duration : elapsed % schedule.duration;
        var counts = schedule.times.map(function (keys) { return countBy(time, keys); });
        var active = counts.findIndex(function (count, i) { return count < schedule.times[i].length; });
        return { counts: counts, active: active, blink: Math.floor(time / 430) % 2 === 0 };
      }
      function rule(width) {
        return span("edge", "+" + "-".repeat(width - 2) + "+");
      }
      function caption(title, width) {
        var text = ">_ terminal - " + title;
        var controls = "[_] [ ] [X]";
        var inner = text + " ".repeat(width - 4 - text.length - controls.length) + controls;
        return span("edge", "| ") + span("chrome", inner) + span("edge", " |");
      }
      function code(row, count, isActive, showPrompt, width) {
        var prompt = showPrompt ? row.prompt : " ".repeat(row.prompt.length);
        var remainder = count;
        var content = span("prompt", prompt);
        var typed = "";
        for (var token of row.tokens) {
          var part = token[0].slice(0, Math.max(0, remainder));
          if (part) typed += span(token[1] || "plain", part);
          remainder -= part.length;
        }
        if (row.href && count === textOf(row).length) {
          typed = '<a class="ascii-link" href="' + escapeHtml(row.href) + '">' + typed + "</a>";
        }
        content += typed;
        var cursor = isActive ? "_" : "";
        if (cursor) content += span("cursor", cursor);
        var padding = width - 4 - prompt.length - count - cursor.length;
        return span("edge", "| ") + content + " ".repeat(Math.max(0, padding)) + span("edge", " |");
      }
      function panel(title, rows, counts, active, width, offset, blink) {
        var lines = [rule(width), caption(title, width), rule(width)];
        for (var i = 0; i < rows.length; i++) {
          var globalIndex = offset + i;
          var finished = active < 0;
          var show = finished || globalIndex <= active || counts[globalIndex] > 0;
          var caret = globalIndex === active && blink;
          lines.push(code(rows[i], counts[globalIndex], caret, show, width));
        }
        lines.push(rule(width));
        return lines.join("\n");
      }

      function contactsPanel(cards, state) {
        var width = 46;
        var lines = [rule(width), caption("contacts.py", width), rule(width)];
        cards.forEach(function (card, cardIndex) {
          var heading = "  [ " + card.title.replace(".py", "").toUpperCase() + " ]";
          lines.push(span("edge", "| ") + span("class-name", heading) +
                     " ".repeat(width - 4 - heading.length) + span("edge", " |"));
          card.rows.forEach(function (row, rowIndex) {
            var index = cardIndex * 3 + rowIndex;
            var show = state.active < 0 || index <= state.active || state.counts[index] > 0;
            var caret = index === state.active && state.blink;
            lines.push(code(row, state.counts[index], caret, show, width));
          });
          lines.push(rule(width));
        });
        return lines.join("\n");
      }
      function draw(now) {
        var elapsed = Math.max(0, now - started);
        var intro = state(introSchedule, elapsed);
        var links = state(linksSchedule, elapsed);
        var introHtml = panel("profile.py", profile, intro.counts, intro.active, 86, 0, intro.blink);
        var linksHtml = contactsPanel(cards, links);
        if (introHtml !== previousIntro) {
          introNode.innerHTML = introHtml;
          previousIntro = introHtml;
        }
        if (linksHtml !== previousLinks) {
          linksNode.innerHTML = linksHtml;
          previousLinks = linksHtml;
        }
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    }());
  </script>
</div>

      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      var frames = [firstFrame];
      var started = performance.now();
      var previous = -1;
      var width = 94;

      function escapeHtml(value) {
        return value.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function span(name, value) {
        return '<span class="' + name + '">' + escapeHtml(value) + "</span>";
      }
      function rule() {
        return span("edge", "+" + "-".repeat(width - 2) + "+");
      }
      function caption() {
        var text = ">_ CORTEX_VIEW - PIAL SURFACE";
        var buttons = "[_] [ ] [X]";
        var gap = " ".repeat(width - 4 - text.length - buttons.length);
        return span("edge", "| ") + span("chrome", text + gap + buttons) + span("edge", " |");
      }
      function brainRow(glyphs, codes) {
        var result = span("edge", "|  ");
        for (var x = 0; x < glyphs.length;) {
          var end = x + 1;
          while (end < glyphs.length && codes[end] === codes[x]) end++;
          result += span("c" + codes[x], glyphs.slice(x, end));
          x = end;
        }
        return result + span("edge", "  |");
      }
      function status(frame) {
        var progress = Math.round((frame + 1) / 120 * 20);
        var text = "FRAME " + String(frame + 1).padStart(3, "0") +
          "/120  PIAL SURFACE  [" + "#".repeat(progress) + ".".repeat(20 - progress) + "]";
        return span("edge", "| ") + span("chrome", text.padEnd(width - 4, " ")) + span("edge", " |");
      }
      function render(frame) {
        var glyphs = frames[frame][0];
        var codes = frames[frame][1];
        var rows = [rule(), caption(), rule()];
        for (var y = 0; y < 54; y++) {
          rows.push(brainRow(glyphs.slice(y * 88, (y + 1) * 88),
                             codes.slice(y * 88, (y + 1) * 88)));
        }
        rows.push(rule(), status(frame), rule());
        screen.innerHTML = rows.join("\n");
      }
      async function unpack() {
        if (typeof DecompressionStream === "undefined") return null;
        var binary = atob(packedFrames);
        var bytes = Uint8Array.from(binary, function (char) { return char.charCodeAt(0); });
        var stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"));
        return JSON.parse(await new Response(stream).text());
      }
      function animate(now) {
        var frame = reduceMotion.matches ? 30 : Math.floor((now - started) / 40) % frames.length;
        if (frame !== previous) {
          render(frame);
          previous = frame;
        }
        requestAnimationFrame(animate);
      }
      render(0);
      unpack().then(function (decoded) {
        if (!decoded || decoded.length !== 120) return;
        frames = decoded;
        started = performance.now();
        previous = -1;
        requestAnimationFrame(animate);
      }).catch(function () {
        /* Keep the first ASCII frame visible if decompression is unavailable. */
      });
    }());
  </script>
</div>
